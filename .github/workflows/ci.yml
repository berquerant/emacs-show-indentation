name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    permissions:
      contents: read # checkout repository for Emacs CI
    uses: berquerant/reusable-workflows/.github/workflows/emacs-ci.yml@v0.9.2
